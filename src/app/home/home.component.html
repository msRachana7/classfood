<section class="hero-section">
  <div class="container py-5">
    <div class="row align-items-center g-5">
      <div class="col-lg-6">
        <span class="badge text-bg-danger mb-3">Fresh & Fast</span>
        <h1 class="display-4 fw-bold">Discover the best food near you</h1>
        <p class="lead text-secondary">
          Explore top restaurants, order your favorite dishes, and enjoy amazing food experiences with just a few clicks.
        </p>
        <div class="d-flex gap-3 flex-wrap">
          <a routerLink="/services" class="btn btn-danger btn-lg">Explore Services</a>
          <a routerLink="/contact" class="btn btn-outline-dark btn-lg">Contact Us</a>
        </div>
      </div>

      <div class="col-lg-6">
        <div id="foodCarousel" class="carousel slide shadow-lg rounded-4 overflow-hidden" data-bs-ride="carousel">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#foodCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#foodCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#foodCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
          </div>

          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzIt-LHXm87EAN0hA-Y6bPEOvYcx_j0Jqaj95k311IVA&s=10" class="d-block w-100" alt="Restaurant food 1" style="height: 420px; object-fit: cover;" />
            </div>
            <div class="carousel-item">
              <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROlMKxA1yo-leIS1I2eOKO7eolc-vUPzVQE602gLCyhg&s=10" class="d-block w-100" alt="Restaurant food 2" style="height: 420px; object-fit: cover;" />
            </div>
            <div class="carousel-item">
              <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ11CAWx84xynMtOi83_G4rsE6hA_insxLk_ZR1YTKBqQ&s=10" class="d-block w-100" alt="Restaurant food 3" style="height: 420px; object-fit: cover;" />
            </div>
          </div>

          <button class="carousel-control-prev" type="button" data-bs-target="#foodCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#foodCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
