<section class="auth-wrapper">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5">
          <h2 class="text-center fw-bold mb-4">Login</h2>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                formControlName="email"
                placeholder="Enter your email"
                [ngClass]="{ 'is-invalid': loginForm.get('email')?.touched && loginForm.get('email')?.invalid }"
              />
              <div class="invalid-feedback" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
                <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</span>
                <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email.</span>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                formControlName="password"
                placeholder="Enter your password"
                [ngClass]="{ 'is-invalid': loginForm.get('password')?.touched && loginForm.get('password')?.invalid }"
              />
              <div class="invalid-feedback" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
                <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</span>
                <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</span>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" />
                <label class="form-check-label" for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="text-decoration-none text-danger">Forgot password?</a>
            </div>

            <div *ngIf="loginError" class="alert alert-danger mt-2 mb-3">
              {{ loginError }}
            </div>

            <button type="submit" class="btn btn-danger w-100 py-2">Login</button>

            <div *ngIf="loginError" class="d-flex gap-2 mt-3">
              <button type="button" class="btn btn-outline-secondary flex-fill" (click)="tryAgain()">Try Again</button>
              <a routerLink="/signup" class="btn btn-warning text-dark flex-fill">Sign Up</a>
            </div>

            <p class="text-center mt-3 mb-0 text-secondary">
              Don’t have an account?
              <a routerLink="/signup" class="text-danger text-decoration-none fw-semibold">Sign up</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
