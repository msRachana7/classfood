<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4">
        <h2 class="fw-bold text-center mb-4">Contact Us</h2>

        <form>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" placeholder="Enter your name" />
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter your email" />
          </div>

          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="5" placeholder="Write your message..."></textarea>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-danger px-4">Send Message</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
