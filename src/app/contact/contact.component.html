<section class="contact-page py-5">
  <div class="container">
    <div class="text-center mb-5">
      <span class="section-tag">Get in touch</span>
      <h2 class="fw-bold">We’d love to hear from you</h2>
      <p class="text-secondary">Reach out for partnerships, orders, support, or general inquiries.</p>
    </div>

    <div class="row g-4 mb-5">
      <div class="col-md-4">
        <div class="info-card">
          <i class="bi bi-geo-alt-fill"></i>
          <h4>Visit us</h4>
          <p>45 Food Street, Downtown Plaza, Bengaluru</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="info-card">
          <i class="bi bi-telephone-fill"></i>
          <h4>Call us</h4>
          <p>+91 98765 43210</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="info-card">
          <i class="bi bi-envelope-fill"></i>
          <h4>Email</h4>
          <p>hello@zomatoapp.com</p>
        </div>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card border-0 shadow-sm p-4 p-md-5">
          <form>
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" placeholder="Your name" />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="Your email" />
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
            </div>
            <button type="submit" class="btn btn-danger px-4">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
